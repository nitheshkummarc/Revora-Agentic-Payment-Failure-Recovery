# Single FastAPI process with in-memory state. No database, no message queue,
# no service split. A frontend service is added alongside the dashboard.
services:
  backend:
    image: python:3.11-slim
    working_dir: /srv/backend
    # The whole repo, not just backend/: the batch-results endpoint falls back
    # to reading data/batch_results.json, which lives beside backend/ rather
    # than inside it.
    volumes:
      - ./:/srv
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
