# Single FastAPI process. No database, no message queue, no microservices --
# see the global "do NOT build" list in RecoverX_Build_Prompts.md.
# The frontend service is added in Module 8.
services:
  backend:
    image: python:3.11-slim
    working_dir: /srv
    volumes:
      - ./backend:/srv
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
