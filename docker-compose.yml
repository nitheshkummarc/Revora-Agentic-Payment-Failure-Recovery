# Single FastAPI process with in-memory state. No database, no message queue,
# no service split. Only the backend is containerised here; the frontend
# (frontend/) runs separately via `npm run dev`/`npm run build` — see README.
services:
  backend:
    image: python:3.11-slim
    working_dir: /srv/backend
    # The whole repo, not just backend/: the batch-results endpoint falls back
    # to reading data/batch_results.json, which lives beside backend/ rather
    # than inside it.
    volumes:
      - ./:/srv
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # Published on the host's loopback only. The API has no authentication
    # and its gateway routes can write, so it is not exposed to the network;
    # uvicorn still binds 0.0.0.0 because that is the container's interface.
    ports:
      - "127.0.0.1:8000:8000"
